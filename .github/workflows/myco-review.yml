name: MyCo Automated SDET Review

on:
  pull_request:
    types: [opened, synchronize, reopened]

jobs:
  myco-review:
    name: MyCo Intelligent PR Review
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Run MyCo AI Review
        env:
          LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "Starting MyCo AI SDET Review on Pull Request..."
          echo "Customer Tenant: cust_fad06a6eebec1cfd (xyz)"
          echo "Repository: jaganbhakti900/testing"
          npx --yes myco-pr-reviewer --pr-url "${{ github.event.pull_request.html_url }}" || true
